name: da-postork-dev

services:
  app:
    extends:
      file: docker-compose.base.yml
      service: app
    user: '${UID:-1000}:${GID:-1000}'
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
    command: ['sh', '-c', 'npm run migrate && npm run start:dev']

  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    ports:
      - '127.0.0.1:5432:5432'
    env_file:
      - .env.development
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
