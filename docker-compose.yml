name: da-postork-prod

services:
  migrator:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrator
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    extends:
      file: docker-compose.base.yml
      service: app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runner
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    depends_on:
      migrator:
        condition: service_completed_successfully

  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    env_file:
      - .env.production
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    extends:
      file: docker-compose.base.yml
      service: redis
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
